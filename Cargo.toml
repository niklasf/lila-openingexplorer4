[package]
name = "lila-openingexplorer4"
version = "0.1.0"
edition = "2024"

[dependencies]
arbitrary = { version = "1.4.2", features = ["derive"] }
arrow-array = "60.0.0"
arrow-schema = "60.0.0"
bitflags = "2.10.0"
btoi = "0.5.0"
bytes = "1.11.0"
clap = { version = "4.5.53", features = ["derive"] }
crossbeam = "0.8.4"
indicatif = "0.18.3"
libc = "0.2"
nohash-hasher = "0.2.0"
parquet = { version = "60.0.0", default-features = false, features = ["zstd", "lz4", "arrow"] }
pgn-reader = { version = "0.29.1", git = "https://github.com/niklasf/shakmaty.git", branch = "main" }
rocksdb = { version = "0.25.0", git = "https://github.com/niklasf/rust-rocksdb.git", branch = "lila-openingexplorer4", features = ["lz4", "zstd", "jemalloc"], default-features = false }
rustc-hash = "2.1.1"
shakmaty = { version = "0.30.2", git = "https://github.com/niklasf/shakmaty.git", branch = "main", features = ["arbitrary", "variant", "nohash-hasher"] }
thiserror = "2.0.12"
tikv-jemallocator = "0.7"
zstd = "0.13.3"

[dev-dependencies]
arbtest = "0.3.2"

[profile.release]
debug = true

[package]
name = "lila-openingexplorer4"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
btoi = "0.5.0"
bytes = "1.11.0"
clap = { version = "4.5.53", features = ["derive"] }
crossbeam = "0.8.4"
fjall = { git = "https://github.com/fjall-rs/fjall.git", features = ["bytes_1"] }
indicatif = "0.18.3"
itertools = "0.14.0"
pgn-reader = { version = "0.28.0", git = "https://github.com/niklasf/shakmaty.git" }
shakmaty = { version = "0.29.0", git = "https://github.com/niklasf/shakmaty.git", features = ["variant"] }
thiserror = "2.0.12"
tikv-jemallocator = "0.6.1"
zstd = "0.13.3"

[dev-dependencies]
quickcheck = "1.0.3"

[profile.release]
debug = true

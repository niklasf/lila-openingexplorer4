[package]
name = "lila-openingexplorer4"
version = "0.1.0"
edition = "2024"

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
arrow-array = "60"
arrow-schema = "60"
axum = "0.8"
bitflags = "2"
btoi = "0.5"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
crossbeam = "0.8"
env_logger = "0.11"
indicatif = "0.18"
libc = "0.2"
log = "0.4"
moka = { version = "0.12", features = ["future"] }
nohash-hasher = "0.2"
partial_sort = "1"
parquet = { version = "60", default-features = false, features = ["zstd", "lz4", "arrow"] }
pgn-reader = { version = "0.29", git = "https://github.com/niklasf/shakmaty.git", branch = "main" }
rocksdb = { version = "0.25", git = "https://github.com/niklasf/rust-rocksdb.git", branch = "lila-openingexplorer4", features = ["lz4", "zstd", "jemalloc"], default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
sha2 = "0.11"
shakmaty = { version = "0.30", git = "https://github.com/niklasf/shakmaty.git", branch = "main", features = ["arbitrary", "variant", "nohash-hasher"] }
thiserror = "2"
tikv-jemallocator = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "0.7", features = ["cors"] }
zstd = "0.14"
hmac = "0.13"
getrandom = "0.4"
memchr = "2"
futures-util = "0.3"

[dev-dependencies]
arbtest = "0.3"

[profile.release]
debug = true

[package]
name = "lila-openingexplorer4"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
arbitrary = { version = "1.4.2", features = ["derive"] }
bitflags = "2.10.0"
btoi = "0.5.0"
bytes = "1.11.0"
clap = { version = "4.5.53", features = ["derive"] }
crossbeam = "0.8.4"
indicatif = "0.18.3"
nohash-hasher = "0.2.0"
parquet = { version = "60.0.0", default-features = false, features = ["zstd"] }
pgn-reader = { version = "0.28.0", git = "https://github.com/niklasf/shakmaty.git", branch = "incremental-zobrist-hash" }
roaring = "0.11.4"
#rocksdb = { version ="0.24.0", features = ["lz4", "jemalloc"], default-features = false }
rustc-hash = "2.1.1"
shakmaty = { version = "0.29.0", git = "https://github.com/niklasf/shakmaty.git", branch = "incremental-zobrist-hash", features = ["arbitrary", "variant", "nohash-hasher"] }
thiserror = "2.0.12"
tikv-jemallocator = "0.6.1"
zstd = "0.13.3"

[dev-dependencies]
arbtest = "0.3.2"

[profile.release]
debug = true
